[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evomorph"
version = "0.1.0"
description = "易衍·Evomorph — 六十四卦指令集进化编程语言"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "prompt_toolkit>=3.0",
    "rich>=13.0",
]
keywords = ["evomorph", "i-ching", "hexagram", "evolutionary", "programming-language", "genetic-algorithm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]

# [project.scripts]
# evo-ai = "evomorph.cli.evo_ai:main"
# Note: Python entry points removed after migration to native .evob runtime

[tool.setuptools.packages.find]
include = []

[tool.setuptools.package-data]
evomorph = []
